- name: Install Node Exporter on all servers
  hosts: HQ-SRV
  become: yes
  tasks:
    - name: Check if node_exporter is installed
      command: /usr/local/bin/node_exporter --version
      register: ne_check
      ignore_errors: yes
      changed_when: false

    - name: Download and install node_exporter
      when: ne_check is failed
      block:
        - name: Download node_exporter
          get_url:
            url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
            dest: /tmp/node_exporter.tar.gz

        - name: Extract node_exporter
          unarchive:
            src: /tmp/node_exporter.tar.gz
            dest: /tmp/
            remote_src: yes

        - name: Install binary
          copy:
            src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
            dest: /usr/local/bin/node_exporter
            mode: '0755'
            remote_src: yes

    - name: Create node_exporter user if not exists
      user:
        name: node_exporter
        shell: /bin/false
        system: yes

    - name: Deploy systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target
          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          [Install]
          WantedBy=multi-user.target
      notify: restart node_exporter

    - name: Ensure node_exporter is running
      systemd:
        name: node_exporter
        state: started
        enabled: yes

  handlers:
    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
